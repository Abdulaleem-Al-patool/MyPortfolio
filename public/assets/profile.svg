<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11363e"/>
      <stop offset="70%" stop-color="#072227"/>
      <stop offset="100%" stop-color="#04161a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FBDBA"/>
      <stop offset="100%" stop-color="#35858B"/>
    </linearGradient>
  </defs>

  <!-- Deep Background Circle -->
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  
  <!-- Subtle Architectural Rings -->
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#1d4d57" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Centered Professional Monogram Badge -->
  <circle cx="200" cy="180" r="88" fill="#072227" stroke="#35858B" stroke-width="2"/>
  
  <!-- Monogram Initials -->
  <text 
    x="200" 
    y="198" 
    font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
    font-size="64" 
    font-weight="800" 
    fill="#AEFEFF" 
    text-anchor="middle" 
    letter-spacing="-1"
  >AM</text>

  <!-- Name & Professional Subtitle -->
  <text 
    x="200" 
    y="300" 
    font-family="'JetBrains Mono', monospace" 
    font-size="14" 
    font-weight="600" 
    fill="#4FBDBA" 
    text-anchor="middle" 
    letter-spacing="2"
  >AHMED MUFEED</text>

  <text 
    x="200" 
    y="324" 
    font-family="'JetBrains Mono', monospace" 
    font-size="11" 
    font-weight="400" 
    fill="#7bb5b8" 
    text-anchor="middle" 
    letter-spacing="1.5"
  >SOFTWARE &amp; AI ENGINEER</text>
</svg>
